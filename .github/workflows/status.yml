name: status

# Rebuilds the public status page on GitHub Pages from the live records in S3
# and the monthly AWS Budget, and whenever the page code changes on main.
#
# Hourly from 07:17 to 18:17 UTC. That covers the 09:00 forecast, the 10:15
# deadline and the 14:30 scoring run (Berlin), including scoring's up to 3
# hours of waiting for late prices, in summer and winter time. GitHub often
# starts scheduled runs hours late, so with one run an hour a late start
# costs about an hour of staleness instead of half a day. Minute 17 avoids
# the busy top of the hour. Each build is a handful of S3 reads and a free
# Budgets API call, and Actions minutes are free on a public repo.
#
# GitHub pauses scheduled workflows after 60 days without commits; a manual
# run (workflow_dispatch) starts them again.

on:
  schedule:
    - cron: "17 7-18 * * *"
  push:
    branches: [main]
    paths:
      - src/voltcast/status.py
      - src/voltcast/page.py
      - .github/workflows/status.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt -e .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Read-only and trusted from main only (aws-oidc-bootstrap, role-voltcast.tf).
          role-to-assume: ${{ vars.AWS_STATUS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build the page
        run: |
          # The data bucket is named voltcast-data-<account> (infrastructure/storage.tf).
          account=$(aws sts get-caller-identity --query Account --output text)
          python -m voltcast --store "s3://voltcast-data-$account" status --out site --budget voltcast-monthly
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
