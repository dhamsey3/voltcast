[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dayahead"
version = "0.1.0"
description = "Live day-ahead electricity price forecasts for Germany/Luxembourg"
requires-python = ">=3.13"
# Runtime needs only the standard library plus tzdata (the Lambda image has
# no system time-zone database). boto3 is provided by the Lambda runtime.
dependencies = ["tzdata"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
